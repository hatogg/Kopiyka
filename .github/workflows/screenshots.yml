# Справжні скриншоти для README: застосунок проходить екрани в емуляторі Android 14 (Pixel 7)
# українською та англійською, у світлій і темній темі, і PNG комітяться в docs/screens.
name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/src/**", ".github/workflows/screenshots.yml", ".github/screenshots.sh"]

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  shots:
    name: Emulator screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the app and the screenshot test
        id: build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --console=plain 2>&1 | tee build.log
      - name: Why the build failed
        if: failure() && steps.build.outcome == 'failure'
        run: python3 .github/annotate.py build.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots in the emulator
        id: shots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_7
          script: bash .github/screenshots.sh
      - name: Why the screenshots failed
        if: failure() && steps.shots.outcome == 'failure'
        run: |
          f=crash.log; [ -s "$f" ] || f=instrument.log
          head -c 2500 "$f" 2>/dev/null | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'); print('::error title=screenshot test::' + (t or 'no log'))"
      - name: Keep the logs (and partial screenshots on failure) in the ci-log branch
        if: always() && (steps.shots.outcome == 'failure' || steps.shots.outcome == 'success')
        run: |
          mkdir -p /tmp/log && cp -r instrument.log crash.log logcat.log test.log /tmp/log/ 2>/dev/null || true
          if [ "${{ steps.shots.outcome }}" = failure ]; then cp -r docs/screens /tmp/log/ 2>/dev/null || true; fi
          cd /tmp/log
          git init -q -b ci-log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "screenshot logs for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log
      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screens
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Screenshots from the Android emulator"
          git pull --rebase origin main
          git push origin HEAD:main
